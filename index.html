<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PS Trophy Viewer</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <!-- ===================== HEADER ===================== -->
    <header class="top-bar">
      <div class="logo">
        <svg
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path d="M7 4h10c0 5-2 8-5 8s-5-3-5-8z" fill="#0072ce" />
          <path d="M11 12v5h2v-5" fill="#0072ce" />
          <rect x="8" y="17" width="8" height="3" rx="1" fill="#0072ce" />
        </svg>
        <span>PS Trophy Viewer</span>
      </div>
    </header>

    <!-- ===================== VIEWS ===================== -->
    <main id="app">
      <!-- VUE 1 : DASHBOARD (Liste des jeux + Stats) -->
      <section id="view-dashboard" class="view hidden">
        <div class="dashboard-head">
          <h1>Mes jeux</h1>
          <span class="badge" id="games-count">0 jeu</span>
        </div>

        <div id="global-stats" class="global-stats"></div>
        <div class="game-grid" id="game-grid"></div>
      </section>

      <!-- VUE 2 : DÉTAIL JEU (Liste des trophées) -->
      <section id="view-game" class="view hidden">
        <button class="btn btn-ghost back-btn" id="btn-back">
          ← Retour aux jeux
        </button>
        <div id="game-detail"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
