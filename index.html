<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PS Trophy Viewer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Confettis -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Chart.js pour le graphique -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header class="top-bar">
      <div class="logo">
        <svg
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path d="M7 4h10c0 5-2 8-5 8s-5-3-5-8z" fill="#0072ce" />
          <path d="M11 12v5h2v-5" fill="#0072ce" />
          <rect x="8" y="17" width="8" height="3" rx="1" fill="#0072ce" />
        </svg>
        <span>PS Trophy Viewer</span>
      </div>

      <div class="actions">
        <button id="btn-nav-dash" class="btn btn-ghost active">🎮 Jeux</button>
        <button id="btn-nav-platinums" class="btn btn-ghost">
          🏆 Platines
        </button>
        <button id="btn-nav-timeline" class="btn btn-ghost">📜 Timeline</button>
        <button
          id="btn-sound"
          class="btn btn-ghost"
          title="Activer/Désactiver le son"
        >
          🔊
        </button>
      </div>
    </header>

    <main id="app">
      <!-- VUE 1 : DASHBOARD -->
      <section id="view-dashboard" class="view hidden">
        <div class="dashboard-head">
          <h1>Mes jeux</h1>
          <span class="badge" id="games-count">0 jeu</span>
        </div>

        <div id="hunter-level-card" class="hunter-card"></div>

        <!-- Graphique de progression -->
        <div class="chart-container">
          <h3>Évolution du Score de Chasseur</h3>
          <canvas id="progressChart"></canvas>
        </div>

        <div id="global-stats" class="global-stats"></div>
        <div class="game-grid" id="game-grid"></div>
      </section>

      <!-- VUE 2 : DÉTAIL JEU -->
      <section id="view-game" class="view hidden">
        <button class="btn btn-ghost back-btn" id="btn-back">
          ← Retour aux jeux
        </button>
        <div id="game-detail"></div>
      </section>

      <!-- VUE 3 : TIMELINE -->
      <section id="view-timeline" class="view hidden">
        <div class="dashboard-head">
          <h1>Mes exploits récents</h1>
        </div>
        <div class="timeline-container" id="timeline-container"></div>
      </section>

      <!-- VUE 4 : MUR DES PLATINES -->
      <section id="view-platinums" class="view hidden">
        <div class="dashboard-head">
          <h1>Mur des Platines</h1>
          <span class="badge" id="platinum-count">0 Platine(s)</span>
        </div>
        <div class="platinum-grid" id="platinum-grid"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
